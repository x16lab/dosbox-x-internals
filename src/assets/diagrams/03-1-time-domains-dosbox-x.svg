<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
    <defs>
        <style>
            svg {
            --fg-title: #111827;
            --fg-subtitle: #4b5563;
            --arrow: #374151;

            --indigo-bg: #eef2ff;
            --indigo-border: #6366f1;
            --indigo-label: #4338ca;
            --indigo-code: #1e1b4b;
            --indigo-note: #4b5563;

            --green-bg: #ecfdf5;
            --green-border: #10b981;
            --green-label: #065f46;
            --green-code: #064e3b;
            --green-note: #4b5563;

            --orange-bg: #fff7ed;
            --orange-border: #f97316;
            --orange-label: #9a3412;
            --orange-code: #7c2d12;
            --orange-footnote: #9a3412;

            --footer-line: #e5e7eb;
            --footer-text: #374151;
            --footer-subtext: #4b5563;

            --box-bg: #f3f4f6;
            --box-border: #9ca3af;
            --box-text: #374151;

            --dashed-line: #6b7280;
            }

            [data-theme='dark'] svg {
            --fg-title: #f3f4f6;
            --fg-subtitle: #cbd5e1;
            --arrow: #9ca3af;

            --indigo-bg: #26264d;
            --indigo-border: #818cf8;
            --indigo-label: #a5b4fc;
            --indigo-code: #e0e7ff;
            --indigo-note: #9ca3af;

            --green-bg: #163a2e;
            --green-border: #34d399;
            --green-label: #6ee7b7;
            --green-code: #d1fae5;
            --green-note: #9ca3af;

            --orange-bg: #3a2413;
            --orange-border: #fb923c;
            --orange-label: #fdba74;
            --orange-code: #fed7aa;
            --orange-footnote: #fdba74;

            --footer-line: #374151;
            --footer-text: #e5e7eb;
            --footer-subtext: #cbd5e1;

            --box-bg: #1f2937;
            --box-border: #94a3b8;
            --box-text: #e5e7eb;

            --dashed-line: #94a3b8;
            }
        </style>

        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
        </marker>
    </defs>

    <!-- Outer frame -->
    <rect x="30" y="30" width="840" height="580" rx="14" fill="none" stroke="var(--box-border)" stroke-width="1.5"/>
    <text x="450" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="var(--fg-title)">TIME DOMAINS IN DOSBOX-X</text>
    <line x1="50" y1="86" x2="850" y2="86" stroke="var(--footer-line)" stroke-width="1"/>

    <!-- Host Wall Clock -->
    <rect x="70" y="110" width="230" height="150" rx="10" fill="var(--box-bg)" stroke="var(--box-border)" stroke-width="1.5"/>
    <text x="185" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="var(--box-text)">HOST WALL CLOCK</text>
    <text x="90" y="160" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="var(--box-text)">GetTicks()</text>
    <text x="90" y="176" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="var(--box-text)">SDL_GetTicks()</text>
    <text x="90" y="204" font-size="9.5" fill="var(--box-text)">monotonic, host OS</text>
    <text x="90" y="218" font-size="9.5" fill="var(--box-text)">resolution: 1–10ms</text>

    <!-- Guest Milliseconds -->
    <rect x="320" y="110" width="230" height="150" rx="10" fill="var(--box-bg)" stroke="var(--box-border)" stroke-width="1.5"/>
    <text x="435" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="var(--box-text)">GUEST MILLISECONDS</text>
    <text x="340" y="160" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="var(--box-text)">PIC_Ticks</text>
    <text x="340" y="188" font-size="9.5" fill="var(--box-text)">simulated milliseconds</text>
    <text x="340" y="202" font-size="9.5" fill="var(--box-text)">completed so far</text>

    <!-- CPU Cycles -->
    <rect x="570" y="110" width="230" height="150" rx="10" fill="var(--box-bg)" stroke="var(--box-border)" stroke-width="1.5"/>
    <text x="685" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="var(--box-text)">CPU CYCLES</text>
    <text x="590" y="160" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="var(--box-text)">CPU_CycleMax</text>
    <text x="590" y="176" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="var(--box-text)">CPU_CycleLeft</text>
    <text x="590" y="192" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="var(--box-text)">CPU_Cycles</text>

    <!-- Straight drops from each source, joined into a bus, single trunk into Reconciliation Layer -->
    <line x1="185" y1="260" x2="185" y2="290" stroke="var(--arrow)" stroke-width="1.5" />
    <line x1="435" y1="260" x2="435" y2="290" stroke="var(--arrow)" stroke-width="1.5" />
    <line x1="685" y1="260" x2="685" y2="290" stroke="var(--arrow)" stroke-width="1.5" />
    <line x1="185" y1="290" x2="685" y2="290" stroke="var(--arrow)" stroke-width="1.5"/>
    <line x1="435" y1="290" x2="435" y2="308" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Reconciliation Layer -->
    <rect x="70" y="310" width="730" height="110" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="90" y="334" font-size="12" font-weight="700" fill="var(--indigo-label)">RECONCILIATION LAYER</text>
    <text x="90" y="358" font-family="Consolas, Menlo, monospace" font-size="13" fill="var(--indigo-code)">increaseticks()</text>
    <text x="90" y="382" font-size="11" fill="var(--indigo-note)">compares ticksScheduled vs ticksDone</text>
    <text x="90" y="398" font-size="11" fill="var(--indigo-note)">sleeps when ahead (SDL_Delay) · adjusts CPU_CycleMax when behind</text>

    <!-- Arrow down to Composite timestamp -->
    <line x1="435" y1="420" x2="435" y2="462" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Composite "NOW" Timestamp -->
    <rect x="70" y="462" width="730" height="118" rx="10" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.5"/>
    <text x="90" y="486" font-size="12" font-weight="700" fill="var(--green-label)">COMPOSITE "NOW" TIMESTAMP</text>
    <text x="90" y="510" font-family="Consolas, Menlo, monospace" font-size="13" fill="var(--green-code)">PIC_FullIndex() = PIC_Ticks + PIC_TickIndex()</text>
    <text x="90" y="534" font-size="11" fill="var(--green-note)">integer milliseconds completed, plus the fractional millisecond implied by cycles run this tick</text>
    <text x="90" y="550" font-size="11" fill="var(--green-note)">the single timestamp every device — PIC, timers, DMA — reads to ask "what time is it right now?"</text>
</svg>
