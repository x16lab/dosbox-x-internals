<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
    <defs>
        <style>
            svg {
            --fg-title: #111827;
            --fg-subtitle: #4b5563;
            --arrow: #374151;

            --indigo-bg: #eef2ff;
            --indigo-border: #6366f1;
            --indigo-label: #4338ca;
            --indigo-code: #1e1b4b;
            --indigo-note: #4b5563;

            --green-bg: #ecfdf5;
            --green-border: #10b981;
            --green-label: #065f46;
            --green-code: #064e3b;
            --green-note: #4b5563;

            --orange-bg: #fff7ed;
            --orange-border: #f97316;
            --orange-label: #9a3412;
            --orange-code: #7c2d12;
            --orange-footnote: #9a3412;

            --footer-line: #e5e7eb;
            --footer-text: #374151;
            --footer-subtext: #4b5563;

            --box-bg: #f3f4f6;
            --box-border: #9ca3af;
            --box-text: #374151;

            --dashed-line: #6b7280;
            }

            [data-theme='dark'] svg {
            --fg-title: #f3f4f6;
            --fg-subtitle: #cbd5e1;
            --arrow: #9ca3af;

            --indigo-bg: #26264d;
            --indigo-border: #818cf8;
            --indigo-label: #a5b4fc;
            --indigo-code: #e0e7ff;
            --indigo-note: #9ca3af;

            --green-bg: #163a2e;
            --green-border: #34d399;
            --green-label: #6ee7b7;
            --green-code: #d1fae5;
            --green-note: #9ca3af;

            --orange-bg: #3a2413;
            --orange-border: #fb923c;
            --orange-label: #fdba74;
            --orange-code: #fed7aa;
            --orange-footnote: #fdba74;

            --footer-line: #374151;
            --footer-text: #e5e7eb;
            --footer-subtext: #cbd5e1;

            --box-bg: #1f2937;
            --box-border: #94a3b8;
            --box-text: #e5e7eb;

            --dashed-line: #94a3b8;
            }
        </style>

        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
        </marker>
    </defs>

    <!-- Outer frame -->
    <rect x="30" y="30" width="840" height="620" rx="14" fill="none" stroke="var(--box-border)" stroke-width="1.5"/>
    <text x="450" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="var(--fg-title)">PIC_Ticks PROGRESSION</text>
    <line x1="50" y1="86" x2="850" y2="86" stroke="var(--footer-line)" stroke-width="1"/>

    <!-- Initial state -->
    <text x="450" y="124" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="var(--box-text)">PIC_Ticks initially = 0</text>
    <line x1="450" y1="134" x2="450" y2="156" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Execute cycles (1) -->
    <rect x="340" y="162" width="220" height="66" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="450" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="var(--indigo-label)">Execute 1ms of</text>
    <text x="450" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="var(--indigo-label)">CPU cycles</text>

    <line x1="450" y1="228" x2="450" y2="250" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Tick 1 -->
    <text x="450" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="var(--green-code)">TIMER_AddTick(): PIC_Ticks++  (now 1)</text>
    <line x1="450" y1="282" x2="450" y2="304" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Execute cycles (2) -->
    <rect x="340" y="310" width="220" height="66" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="450" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="var(--indigo-label)">Execute 1ms of</text>
    <text x="450" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="var(--indigo-label)">CPU cycles</text>

    <line x1="450" y1="376" x2="450" y2="398" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Tick 2 -->
    <text x="450" y="420" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="var(--green-code)">TIMER_AddTick(): PIC_Ticks++  (now 2)</text>

    <!-- Ellipsis: repeats -->
    <circle cx="450" cy="446" r="2.5" fill="var(--dashed-line)"/>
    <circle cx="450" cy="460" r="2.5" fill="var(--dashed-line)"/>
    <circle cx="450" cy="474" r="2.5" fill="var(--dashed-line)"/>
    <text x="450" y="498" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--fg-subtitle)">(this pair repeats once per completed millisecond of CPU cycles)</text>

    <!-- Footer -->
    <line x1="50" y1="526" x2="850" y2="526" stroke="var(--footer-line)" stroke-width="1"/>
    <text x="450" y="552" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--footer-text)">PIC_Ticks is a simple incrementing counter — its value is never computed from GetTicks()</text>
    <text x="450" y="572" text-anchor="middle" font-size="11" fill="var(--footer-subtext)">but GetTicks() still sets the pace: via increaseticks(), it decides how many of these steps run before the clock is rechecked</text>

    <text x="450" y="602" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--orange-footnote)">TIMER_AddTick() also resets CPU_CycleLeft/CPU_Cycles for the next millisecond and advances</text>
    <text x="450" y="618" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--orange-footnote)">every pending PIC_AddEvent() timer by one tick — omitted above for focus</text>
</svg>
