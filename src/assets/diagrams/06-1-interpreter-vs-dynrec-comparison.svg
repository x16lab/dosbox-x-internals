<svg viewBox="0 0 900 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
    <defs>
        <style>
            svg {
            --fg-title: #111827;
            --fg-subtitle: #4b5563;
            --arrow: #374151;

            --indigo-bg: #eef2ff;
            --indigo-border: #6366f1;
            --indigo-label: #4338ca;
            --indigo-code: #1e1b4b;
            --indigo-note: #4b5563;

            --inset-bg: #f9fafb;
            --inset-border: #9ca3af;
            --inset-label: #374151;
            --cell-bg: #ffffff;
            --cell-border: #d1d5db;
            --cell-hl-bg: #dbeafe;
            --cell-hl-border: #3b82f6;
            --cell-text: #374151;
            --offset-label: #374151;
            --segment-label: #1d4ed8;

            --green-bg: #ecfdf5;
            --green-border: #10b981;
            --green-label: #065f46;
            --green-code: #064e3b;
            --green-note: #4b5563;

            --orange-bg: #fff7ed;
            --orange-border: #f97316;
            --orange-label: #9a3412;
            --orange-code: #7c2d12;
            --orange-footnote: #9a3412;

            --footer-line: #e5e7eb;
            --footer-text: #374151;
            --footer-subtext: #4b5563;

            --box-bg: #f3f4f6;
            --box-border: #9ca3af;
            --box-text: #374151;

            --dashed-line: #6b7280;
            }

            [data-theme='dark'] svg {
            --fg-title: #f3f4f6;
            --fg-subtitle: #cbd5e1;
            --arrow: #9ca3af;

            --indigo-bg: #26264d;
            --indigo-border: #818cf8;
            --indigo-label: #a5b4fc;
            --indigo-code: #e0e7ff;
            --indigo-note: #9ca3af;

            --inset-bg: #1f2937;
            --inset-border: #94a3b8;
            --inset-label: #e5e7eb;
            --cell-bg: #111827;
            --cell-border: #6b7280;
            --cell-hl-bg: #1e3a5f;
            --cell-hl-border: #3b82f6;
            --cell-text: #e5e7eb;
            --offset-label: #e5e7eb;
            --segment-label: #60a5fa;

            --green-bg: #163a2e;
            --green-border: #34d399;
            --green-label: #6ee7b7;
            --green-code: #d1fae5;
            --green-note: #9ca3af;

            --orange-bg: #3a2413;
            --orange-border: #fb923c;
            --orange-label: #fdba74;
            --orange-code: #fed7aa;
            --orange-footnote: #fdba74;

            --footer-line: #374151;
            --footer-text: #e5e7eb;
            --footer-subtext: #cbd5e1;

            --box-bg: #1f2937;
            --box-border: #94a3b8;
            --box-text: #e5e7eb;

            --dashed-line: #94a3b8;
            }
        </style>

        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
        </marker>
    </defs>

    <!-- Title -->
    <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="var(--fg-title)">Interpreter vs. dynrec — running the same guest loop</text>
    <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="var(--fg-subtitle)">core_normal re-decodes every pass; dynrec pays that cost once, then jumps straight into cached native code</text>

    <!-- ================= ROW 1: INTERPRETER ================= -->
    <text x="40" y="88" font-size="13" font-weight="700" fill="var(--indigo-label)">INTERPRETER — core_normal (Chapter 5)</text>
    <text x="40" y="104" font-size="10.5" fill="var(--fg-subtitle)">same fetch/decode/execute cost, every single pass through the loop</text>

    <!-- boxes -->
    <rect x="40" y="118" width="180" height="100" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="130" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--indigo-label)">PASS 1</text>
    <text x="130" y="163" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">Fetchb() → decode</text>
    <text x="130" y="178" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">→ execute</text>
    <text x="130" y="200" text-anchor="middle" font-size="9" fill="var(--indigo-note)">core_normal/prefix_none.h</text>

    <rect x="240" y="118" width="180" height="100" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="330" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--indigo-label)">PASS 2</text>
    <text x="330" y="163" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">Fetchb() → decode</text>
    <text x="330" y="178" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">→ execute</text>
    <text x="330" y="200" text-anchor="middle" font-size="9" fill="var(--indigo-note)">identical cost to pass 1</text>

    <rect x="440" y="118" width="180" height="100" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="530" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--indigo-label)">PASS 3</text>
    <text x="530" y="163" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">Fetchb() → decode</text>
    <text x="530" y="178" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">→ execute</text>
    <text x="530" y="200" text-anchor="middle" font-size="9" fill="var(--indigo-note)">identical cost to pass 1</text>

    <rect x="640" y="118" width="180" height="100" rx="10" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.5"/>
    <text x="730" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--indigo-label)">PASS 4</text>
    <text x="730" y="163" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">Fetchb() → decode</text>
    <text x="730" y="178" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="var(--indigo-code)">→ execute</text>
    <text x="730" y="200" text-anchor="middle" font-size="9" fill="var(--indigo-note)">identical cost to pass 1</text>

    <!-- connecting arrows -->
    <line x1="220" y1="168" x2="240" y2="168" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="420" y1="168" x2="440" y2="168" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="620" y1="168" x2="640" y2="168" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- loop-back arc: straight segments with rounded corners -->
    <path d="M730,218 L730,235 A15,15 0 0 1 715,250 L145,250 A15,15 0 0 1 130,235 L130,218"
          fill="none" stroke="var(--dashed-line)" stroke-width="1.5" stroke-dasharray="4,3"
          stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="450" y="288" text-anchor="middle" font-size="11" fill="var(--fg-subtitle)">guest loop branches back — Chapter 5's <tspan font-family="Consolas, Menlo, monospace">Fetchb()</tspan> decodes the same bytes again</text>
    <text x="450" y="304" text-anchor="middle" font-size="10" fill="var(--fg-subtitle)" font-style="italic">cost is identical on pass 2, 3, 4... — nothing is remembered between passes</text>

    <!-- ================= ROW 2: DYNREC ================= -->
    <text x="40" y="336" font-size="13" font-weight="700" fill="var(--fg-title)">DYNREC — Chapter 6</text>
    <text x="40" y="352" font-size="10.5" fill="var(--fg-subtitle)">decode cost appears exactly once; every later pass skips it entirely</text>

    <!-- code cache inset -->
    <rect x="130" y="364" width="645" height="50" rx="10" fill="var(--inset-bg)" stroke="var(--inset-border)" stroke-width="1.25" stroke-dasharray="5,3"/>
    <text x="452" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="var(--inset-label)">CODE CACHE</text>
    <text x="452" y="401" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--inset-label)">one CacheBlockDynRec per translated block (§6.3)</text>

    <!-- arrow: first encounter writes into cache -->
    <line x1="150" y1="450" x2="150" y2="414" stroke="var(--arrow)" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="140" y="433" text-anchor="end" font-size="9" fill="var(--orange-footnote)">written</text>
    <text x="140" y="445" text-anchor="end" font-size="9" fill="var(--orange-footnote)">once</text>

    <!-- arrows: cached passes read from cache -->
    <line x1="375" y1="414" x2="375" y2="450" stroke="var(--arrow)" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line x1="565" y1="414" x2="565" y2="450" stroke="var(--arrow)" stroke-width="1.25" marker-end="url(#arrow)"/>
    <line x1="755" y1="414" x2="755" y2="450" stroke="var(--arrow)" stroke-width="1.25" marker-end="url(#arrow)"/>
    <text x="765" y="433" text-anchor="start" font-size="9" fill="var(--green-note)">read, no</text>
    <text x="765" y="445" text-anchor="start" font-size="9" fill="var(--green-note)">decode</text>

    <!-- box A: first encounter -->
    <rect x="40" y="450" width="220" height="112" rx="10" fill="var(--orange-bg)" stroke="var(--orange-border)" stroke-width="1.5"/>
    <text x="150" y="472" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--orange-label)">FIRST ENCOUNTER</text>
    <text x="150" y="494" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--orange-code)">CreateCacheBlock():</text>
    <text x="150" y="509" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--orange-code)">decode + translate</text>
    <text x="150" y="524" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--orange-code)">≤32 instructions</text>
    <text x="150" y="546" text-anchor="middle" font-size="9" fill="var(--orange-footnote)">one-time cost (§6.3)</text>

    <!-- box B: cached pass 1 -->
    <rect x="300" y="450" width="150" height="112" rx="10" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.5"/>
    <text x="375" y="472" text-anchor="middle" font-size="11" font-weight="700" fill="var(--green-label)">PASS 1 (cached)</text>
    <text x="375" y="497" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">jump straight</text>
    <text x="375" y="512" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">into compiled</text>
    <text x="375" y="527" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">host code</text>
    <text x="375" y="546" text-anchor="middle" font-size="9" fill="var(--green-note)">native execution begins</text>

    <!-- box C: cached pass 2 -->
    <rect x="490" y="450" width="150" height="112" rx="10" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.5"/>
    <text x="565" y="472" text-anchor="middle" font-size="11" font-weight="700" fill="var(--green-label)">PASS 2 (cached)</text>
    <text x="565" y="500" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">native</text>
    <text x="565" y="515" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">execution</text>
    <text x="565" y="546" text-anchor="middle" font-size="9" fill="var(--green-note)">decode never happens again</text>

    <!-- box D: cached pass 3 -->
    <rect x="680" y="450" width="150" height="112" rx="10" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.5"/>
    <text x="755" y="472" text-anchor="middle" font-size="11" font-weight="700" fill="var(--green-label)">PASS 3 (cached)</text>
    <text x="755" y="500" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">native</text>
    <text x="755" y="515" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="var(--green-code)">execution</text>
    <text x="755" y="546" text-anchor="middle" font-size="9" fill="var(--green-note)">same as pass 2, 4, 5...</text>

    <!-- horizontal execution-order arrows -->
    <line x1="260" y1="506" x2="300" y2="506" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="506" x2="490" y2="506" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="640" y1="506" x2="680" y2="506" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="450" y="588" text-anchor="middle" font-size="11" fill="var(--fg-subtitle)">native jump generated directly into the cache (§6.6, <tspan font-family="Consolas, Menlo, monospace">LinkTo()</tspan>) — no return to <tspan font-family="Consolas, Menlo, monospace">CPU_Core_Dynrec_Run()</tspan></text>
    <text x="450" y="604" text-anchor="middle" font-size="10" fill="var(--fg-subtitle)" font-style="italic">decode happens exactly once, in the FIRST ENCOUNTER box — every pass after that is host machine code only</text>

    <!-- ================= COMPARISON BARS ================= -->
    <text x="450" y="642" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fg-title)">SAME GUEST WORK, DIFFERENT WALL-CLOCK COST</text>

    <text x="50" y="674" text-anchor="end" font-size="10.5" fill="var(--fg-subtitle)">core_normal</text>
    <rect x="60" y="654" width="195" height="36" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.25"/>
    <text x="157.5" y="676" text-anchor="middle" font-size="9.5" fill="var(--indigo-label)">pass 1</text>
    <rect x="255" y="654" width="195" height="36" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.25"/>
    <text x="352.5" y="676" text-anchor="middle" font-size="9.5" fill="var(--indigo-label)">pass 2</text>
    <rect x="450" y="654" width="195" height="36" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.25"/>
    <text x="547.5" y="676" text-anchor="middle" font-size="9.5" fill="var(--indigo-label)">pass 3</text>
    <rect x="645" y="654" width="195" height="36" fill="var(--indigo-bg)" stroke="var(--indigo-border)" stroke-width="1.25"/>
    <text x="742.5" y="676" text-anchor="middle" font-size="9.5" fill="var(--indigo-label)">pass 4</text>

    <text x="50" y="728" text-anchor="end" font-size="10.5" fill="var(--fg-subtitle)">dynrec</text>
    <rect x="60" y="708" width="390" height="36" fill="var(--orange-bg)" stroke="var(--orange-border)" stroke-width="1.25"/>
    <text x="255" y="730" text-anchor="middle" font-size="9.5" fill="var(--orange-label)">pass 1 — translate + run</text>
    <rect x="450" y="708" width="130" height="36" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.25"/>
    <text x="515" y="730" text-anchor="middle" font-size="9" fill="var(--green-label)">pass 2</text>
    <rect x="580" y="708" width="130" height="36" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.25"/>
    <text x="645" y="730" text-anchor="middle" font-size="9" fill="var(--green-label)">pass 3</text>
    <rect x="710" y="708" width="130" height="36" fill="var(--green-bg)" stroke="var(--green-border)" stroke-width="1.25"/>
    <text x="775" y="730" text-anchor="middle" font-size="9" fill="var(--green-label)">pass 4</text>

    <!-- Footer -->
    <line x1="70" y1="768" x2="830" y2="768" stroke="var(--footer-line)" stroke-width="1"/>
    <text x="450" y="792" text-anchor="middle" font-size="11.5" fill="var(--footer-text)" font-weight="600">Bar widths are illustrative, not measured — the point is qualitative</text>
    <text x="450" y="812" text-anchor="middle" font-size="10.5" fill="var(--footer-subtext)">dynrec's one-time translation cost amortizes toward zero as pass count grows; the interpreter's cost never does</text>

    <text x="450" y="838" text-anchor="middle" font-size="10" fill="var(--orange-footnote)" font-style="italic">a loop that only runs once or twice may not recoup dynrec's translation cost at all — Chapter 6's own tradeoff, not shown above</text>
    <text x="450" y="854" text-anchor="middle" font-size="10" fill="var(--orange-footnote)" font-style="italic">self-modifying code and paging can also force a hot address back through the interpreter (§6.7, §6.2) — likewise omitted for focus</text>
</svg>